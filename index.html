<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basket Connect</title>
<style>
:root{--bg:#15171c;--s1:#1e2128;--s2:#272b34;--tx:#eef0f5;--mu:#9aa1b2;--or:#ff7a1a;--am:#ffb347;--bd:rgba(255,255,255,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;width:44vmax;height:44vmax;border-radius:50%;filter:blur(90px);opacity:.2;animation:dr 24s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--or);top:-14vmax;left:-10vmax}.bg i:nth-child(2){background:#6d4aff;bottom:-16vmax;right:-10vmax;animation-delay:-8s}
@keyframes dr{to{transform:translate(7vmax,5vmax) scale(1.1)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
:focus-visible{outline:2px solid var(--am);outline-offset:3px;border-radius:8px}
.wrap{max-width:1100px;margin:auto;padding:0 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.ball{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--am),var(--or));animation:bounce 2.4s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-4px)}}
nav{display:flex;gap:4px;background:var(--s1);border:1px solid var(--bd);border-radius:999px;padding:4px;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--mu);font:inherit;padding:8px 16px;border-radius:999px;cursor:pointer;transition:.25s}
nav button[aria-selected=true]{background:var(--s2);color:var(--tx)}
.view{animation:up .45s cubic-bezier(.2,.7,.2,1) both}
.hero{padding:clamp(40px,9vw,90px) 0 24px;max-width:640px}
.hero h1{font-size:clamp(2rem,6vw,3.3rem);line-height:1.08;letter-spacing:-.03em;margin:0 0 14px}
.hero h1 span{background:linear-gradient(90deg,var(--or),var(--am));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mu);margin:0 0 24px;font-size:1.08rem}
.btn{border:0;cursor:pointer;font:inherit;font-weight:700;color:#1a1204;padding:12px 22px;border-radius:12px;background:linear-gradient(135deg,var(--or),var(--am));transition:transform .2s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px -8px rgba(255,122,26,.6)}.btn:active{transform:scale(.97)}
.btn.g{background:var(--s2);color:var(--tx)}.btn.g:hover{box-shadow:none}.btn:disabled{opacity:.5;pointer-events:none}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:22px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--or);outline:0;box-shadow:0 0 0 3px rgba(255,122,26,.2)}
label{display:grid;gap:6px;font-size:.85rem;color:var(--mu)}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.full{grid-column:1/-1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:16px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:20px;animation:up .5s cubic-bezier(.2,.7,.2,1) both;transition:transform .3s,border-color .3s,box-shadow .3s}
.card:hover{transform:scale(1.03);border-color:rgba(255,122,26,.5);box-shadow:0 12px 30px -14px rgba(255,122,26,.5)}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--or),var(--am));color:#1a1204;margin-bottom:10px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.card h3{margin:0;font-size:1.05rem}.card small{color:var(--mu)}.card p{color:var(--mu);margin:8px 0 0;font-size:.92rem}
.pill{display:inline-block;font-size:.75rem;padding:2px 10px;border-radius:999px;background:var(--s2);color:var(--am);margin-right:6px}
.chat{display:flex;flex-direction:column;height:max(460px,calc(100vh - 190px));height:max(460px,calc(100dvh - 190px));margin-top:8px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px}
.mw{display:flex;flex-direction:column;align-items:flex-start;max-width:85%}
.mw.new{animation:up .3s both}.mw.me{align-self:flex-end;align-items:flex-end}
.m{background:var(--s2);border-radius:14px 14px 14px 4px;padding:10px 14px;font-size:1.02rem;overflow-wrap:anywhere;max-width:100%}
.m.me{background:rgba(255,122,26,.18);border-radius:14px 14px 4px 14px}
.m b{font-size:.78rem;color:var(--am);display:block}.m span{font-size:.7rem;color:var(--mu)}
.rx{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.rb{border:1px solid var(--bd);background:var(--s1);color:var(--mu);border-radius:999px;padding:2px 10px;font:inherit;font-size:.85rem;cursor:pointer;opacity:.55;transition:opacity .2s,transform .2s,background .2s}
.rb:hover,.rb.has{opacity:1}.rb:hover{transform:scale(1.12)}.rb.on{opacity:1;background:rgba(255,122,26,.22);border-color:var(--or);color:var(--tx)}
.bdg{background:var(--or);color:#1a1204;border-radius:999px;font-size:.72rem;font-weight:800;padding:1px 7px;margin-left:4px}
.send{display:flex;gap:8px;margin-top:12px}
.note{font-size:.85rem;color:var(--mu);background:var(--s2);border-radius:12px;padding:12px 14px;margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--s2);border:1px solid var(--bd);padding:10px 18px;border-radius:999px;animation:up .3s both;z-index:9}
[hidden]{display:none!important}
.conv{display:block;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function mine(){return S.players.filter(function(p){return S.user&&p.id===S.user.id})[0]}

function nav(){
 var t=[["home","Accueil"]].concat(S.user?[["players","Joueurs"],["inbox","Offres"],["club","Mon club"],["chat","Messages"],["me","Mon profil"]]:[["auth","Connexion"]]);
 $("#nv").innerHTML=t.map(function(x){var cn=x[0]==="chat"?S.unread:x[0]==="inbox"?unreadP()+pendingInv().length:0,g=cn?'<span class="bdg">'+(cn>9?"9+":cn)+'</span>':"";return '<button role="tab" data-v="'+x[0]+'" aria-selected="'+(S.view===x[0])+'">'+x[1]+g+'</button>'}).join("")
 +(S.user&&"Notification" in window&&Notification.permission==="default"?'<button data-v="bell" title="Activer les notifications" aria-label="Activer les notifications">🔔</button>':"")
 +(S.user?'<button data-v="out">Déconnexion</button>':"");
 document.title=(S.unread?"("+S.unread+") ":"")+"Basket Connect"
}
$("#nv").onclick=function(e){var b=e.target.closest("button");if(!b)return;
 if(b.dataset.v==="out"){sb.auth.signOut();return}
 if(b.dataset.v==="bell"){Notification.requestPermission().then(function(p){toast(p==="granted"?"Notifications activées":"Notifications non autorisées");nav()});return}
 setView(b.dataset.v)};
function setView(v,keep){S.view=v;if(v==="chat")S.unread=0;if(v==="inbox"&&!keep)S.peer=null;main.classList.remove("view");void main.offsetWidth;main.classList.add("view");nav();draw()}
function draw(){
 nav();
 if(!configured){var why=SUPABASE_URL.indexOf("REMPLACEZ")>-1?"Ce fichier n’est pas la version configurée : l’adresse du projet est absente. Retéléchargez le dernier index.html.":"La bibliothèque Supabase n’a pas pu se charger. Vérifiez votre connexion Internet et désactivez temporairement tout bloqueur (antivirus, bloqueur de publicités, réseau d’entreprise ou d’école).";main.innerHTML='<div class="panel" style="margin-top:24px"><b>Le site ne peut pas démarrer.</b><p style="color:var(--mu)">'+why+'</p></div>';return}
 var v=S.view;
 if(v!=="home"&&!S.user)v="auth";
 if(v==="home")home();else if(v==="auth")auth();else if(v==="players")players();else if(v==="chat")chat();else if(v==="inbox")inbox();else if(v==="club")clubView();else profile()
}
function home(){
 main.innerHTML='<section class="hero"><h1>Une seule plateforme pour <span>tous les basketteurs.</span></h1><p>Créez votre profil de joueur, retrouvez les autres joueurs et échangez dans la discussion commune. Les clubs peuvent aussi contacter les joueurs qui cherchent une équipe.</p><button class="btn" id="go">'+(S.user?(mine()?"Voir les joueurs":"Compléter mon profil"):"Je m’inscris")+'</button></section>';
 $("#go").onclick=function(){if(!S.user){S.mode="up";setView("auth")}else setView(mine()?"players":"me")}
}
function auth(){
 var up=S.mode==="up";
 main.innerHTML='<h2 style="margin:24px 0 12px">'+(up?"Inscription":"Connexion")+'</h2><form class="panel form" id="af" style="max-width:460px">'+
 '<label class="full">Email<input id="em" type="email" required autocomplete="email"></label>'+
 '<label class="full">Mot de passe (8 caractères minimum)<input id="pw" type="password" required minlength="8" autocomplete="'+(up?"new-password":"current-password")+'"></label>'+
 '<div class="full row"><button class="btn" type="submit">'+(up?"Créer mon compte":"Me connecter")+'</button><button type="button" class="btn g" id="sw">'+(up?"J’ai déjà un compte":"Créer un compte")+'</button></div></form>';
 $("#sw").onclick=function(){S.mode=up?"in":"up";auth()};
 $("#af").onsubmit=async function(e){e.preventDefault();var b=e.submitter;b.disabled=true;var c={email:$("#em").value.trim(),password:$("#pw").value};
  var r=up?await sb.auth.signUp(c):await sb.auth.signInWithPassword(c);b.disabled=false;
  if(r.error){toast(up?"Inscription impossible : "+r.error.message:"Email ou mot de passe incorrect");return}
  if(up&&!r.data.session)toast("Compte créé : confirmez votre email puis connectez-vous")}

function players(){
 var list=S.players.slice().sort(function(a,b){return (a.pseudo||"").localeCompare(b.pseudo||"","fr")}),c=myClub();
 main.innerHTML='<h2 style="margin:24px 0 4px">Joueurs</h2>'+(c&&!c.verifie?'<p class="note">Votre club est en attente de validation : vous pourrez inviter des joueurs dès qu’il sera validé.</p>':"")+'<div class="row"><input id="q" type="search" aria-label="Rechercher" placeholder="Rechercher par nom, poste ou ville…" style="max-width:420px"><select id="pf" aria-label="Poste" style="max-width:180px"><option value="">Tous les postes</option>'+POS.map(function(p){return '<option>'+p+'</option>'}).join("")+'</select><label style="display:flex;align-items:center;gap:8px;width:auto"><input id="sc" type="checkbox" style="width:auto"'+(c?" checked":"")+'>Sans club uniquement</label></div><div class="grid" id="g"></div>';
 function d(){var q=$("#q").value.toLowerCase(),pf=$("#pf").value,sc=$("#sc").checked;
  var r=list.filter(function(p){return (!pf||p.poste===pf)&&(!sc||(p.sans_club&&!clubOf(p.id)))&&(!q||((p.pseudo||"")+" "+(p.poste||"")+" "+(p.ville||"")).toLowerCase().indexOf(q)>-1)});
  $("#g").innerHTML=r.length?r.map(function(p,i){var k=clubOf(p.id),iv=invited(p.id),act=canRecruit()&&p.sans_club&&!k&&p.id!==S.user.id?'<div class="row" style="margin-top:12px"><button type="button" class="btn" style="padding:8px 16px" data-iv="'+esc(p.id)+'"'+(iv?" disabled":"")+'>'+(iv?"Invité":"Inviter")+'</button><button type="button" class="btn g" style="padding:8px 16px" data-c="'+esc(p.id)+'">Message</button></div>':"";
   return '<article class="card" style="animation-delay:'+(i%8)*50+'ms"><div class="av">'+avh(p)+'</div><h3>'+esc(p.pseudo)+'</h3><small>'+esc(p.ville||"")+'</small><div style="margin-top:8px"><span class="pill">'+esc(p.poste||"")+'</span>'+(p.taille?'<span class="pill">'+esc(p.taille)+' cm</span>':"")+'<span class="pill">'+esc(p.niveau||"")+'</span>'+(k?'<span class="pill" style="color:var(--tx)">'+esc(k.nom)+'</span>':p.sans_club?'<span class="pill" style="background:rgba(255,122,26,.22);color:var(--tx)">Cherche un club</span>':"")+'</div>'+(p.bio?'<p>'+esc(p.bio)+'</p>':"")+act+'</article>'}).join(""):'<div class="panel" style="grid-column:1/-1;color:var(--mu)">Aucun joueur pour le moment.</div>'}
 $("#q").oninput=d;$("#pf").onchange=d;$("#sc").onchange=d;d()

 var p=mine()||{};
 main.innerHTML='<h2 style="margin:24px 0 12px">'+(p.pseudo?"Mon profil":"Inscription")+'</h2><form class="panel form" id="f">'+
 '<div class="full row"><div class="av" id="pv" style="width:76px;height:76px;margin:0;font-size:1.6rem"></div><label style="flex:1;min-width:180px">Photo de profil<input id="ph" type="file" accept="image/*"></label>'+(p.photo?'<button type="button" class="btn g" id="rp">Retirer la photo</button>':"")+'</div>'+
 '<label>Pseudo<input id="ps" required maxlength="30" value="'+esc(p.pseudo||"")+'"></label>'+

 '<label>Niveau<select id="ni">'+LVL.map(function(x){return '<option'+(p.niveau===x?" selected":"")+'>'+x+'</option>'}).join("")+'</select></label>'+
 '<label class="full">Ville<input id="vi" maxlength="60" value="'+esc(p.ville||"")+'"></label>'+
 '<label class="full">Présentation<textarea id="bi" rows="3" maxlength="240">'+esc(p.bio||"")+'</textarea></label>'+
 '<label class="full jo" style="display:flex;align-items:center;gap:10px"><input id="sc" type="checkbox" style="width:auto"'+(p.sans_club?" checked":"")+'>Je recherche un club (visible des clubs, qui pourront m’inviter)</label>'+
 '<label class="full" style="display:flex;align-items:center;gap:10px"><input id="vs" type="checkbox" style="width:auto"'+(p.visible===false?"":" checked")+'>Afficher mon profil aux autres joueurs</label>'+
 '<div class="full row"><button class="btn" type="submit">Enregistrer</button>'+(p.pseudo?'<button type="button" class="btn g" id="dl">Supprimer mon profil</button>':"")+'</div></form>'+
 '<p class="note">Ne publiez ni téléphone, ni adresse. Les joueurs mineurs doivent s’inscrire avec l’accord d’un responsable.</p>';
 var photo=p.photo||null;function pv(){$("#pv").innerHTML=avh({pseudo:$("#ps").value,photo:photo})}pv();$("#ps").oninput=pv;

  if(r.error){toast("Enregistrement impossible : "+r.error.message);b.disabled=false;return}
  await loadPlayers();toast("Profil enregistré");setView("players")};
 var dl=$("#dl");if(dl)dl.onclick=async function(){if(!confirm("Supprimer votre profil et vos messages ?"))return;var r=await sb.from("profiles").delete().eq("id",S.user.id);if(r.error){toast("Suppression impossible");return}await loadPlayers();await loadMsgs();setView("me")}

function chat(){
 main.innerHTML='<div class="panel chat"><div class="msgs" id="ms" role="log" aria-live="polite"></div><form class="send" id="sf"><input id="tx" maxlength="500" placeholder="Votre message…" aria-label="Message" autocomplete="off"><button class="btn" type="submit">Envoyer</button></form></div><p class="note">Discussion commune à tous les joueurs inscrits. Restez respectueux.</p>';
 var last=0;S.sig=null;S.drawn=null;

}
function rxHTML(m){var r=S.reacts[m.id]||{},cnt={},mk=S.user&&r[S.user.id];Object.keys(r).forEach(function(u){cnt[r[u]]=(cnt[r[u]]||0)+1});
 return '<div class="rx">'+RX.map(function(x){var c=cnt[x[0]]||0;return '<button type="button" class="rb'+(mk===x[0]?" on":"")+(c?" has":"")+'" data-id="'+m.id+'" data-k="'+x[0]+'" aria-pressed="'+(mk===x[0])+'" aria-label="'+x[2]+(c?" ("+c+")":"")+'">'+x[1]+(c?" "+c:"")+'</button>'}).join("")+'</div>'}
function drawMsgs(){var box=$("#ms");if(!box)return;
 var lastId=S.msgs.length?S.msgs[S.msgs.length-1].id:0,sig=S.msgs.length+":"+lastId+":"+JSON.stringify(S.reacts);
 if(sig===S.sig&&box.dataset.s)return;S.sig=sig;
 var low=box.scrollHeight-box.scrollTop-box.clientHeight<80,seen=S.drawn==null?lastId:S.drawn;
 box.innerHTML=S.msgs.length?S.msgs.map(function(m){var me=S.user&&m.user_id===S.user.id,n=(m.profiles&&m.profiles.pseudo)||"Joueur";
  return '<div class="mw'+(me?" me":"")+(m.id>seen?" new":"")+'"><div class="m'+(me?" me":"")+'">'+(me?"":'<b>'+esc(n)+'</b>')+esc(m.text)+' <span>'+new Date(m.created_at).toLocaleTimeString("fr",{hour:"2-digit",minute:"2-digit"})+'</span></div>'+rxHTML(m)+'</div>'}).join(""):'<p style="color:var(--mu)">Aucun message. Lancez la discussion !</p>';
 S.drawn=lastId;
 if(low||!box.dataset.s){box.scrollTop=box.scrollHeight;box.dataset.s=1}}
async function react(id,k){
 if(!mine()){toast("Créez d’abord votre profil");return}
 var o=S.reacts[id]=S.reacts[id]||{},cur=o[S.user.id],r;
 if(cur===k){delete o[S.user.id];drawMsgs();r=await sb.from("message_reactions").delete().eq("message_id",id).eq("user_id",S.user.id)}
 else{o[S.user.id]=k;drawMsgs();r=await sb.from("message_reactions").upsert({message_id:id,user_id:S.user.id,kind:k})}
 if(r.error){toast("Réaction impossible");loadReacts()}}
async function loadReacts(){
 if(!S.user||!S.msgs.length)return;
 var r=await sb.from("message_reactions").select("message_id,user_id,kind").gte("message_id",S.msgs[0].id);
 if(r.error)return;var o={};(r.data||[]).forEach(function(x){(o[x.message_id]=o[x.message_id]||{})[x.user_id]=x.kind});S.reacts=o;drawMsgs()}
function notify(m){
 if(S.view==="chat"&&!document.hidden)return;
 var n=(m.profiles&&m.profiles.pseudo)||"Un joueur",txt=n+" a envoyé un message";
 S.unread++;nav();
 if(!document.hidden)toast(txt+" : "+m.text.slice(0,60));
 else if("Notification" in window&&Notification.permission==="granted"){try{var x=new Notification(txt,{body:m.text.slice(0,100),tag:"msg"});x.onclick=function(){window.focus();setView("chat");x.close()}}catch(e){}}
}

function fillInbox(){var box=$("#ib");if(!box)return;
 if(S.peer){var th=S.prives.filter(function(m){return other(m)===S.peer});
  box.innerHTML=th.length?th.map(function(m){var me=m.from_id===S.user.id;return '<div class="mw'+(me?" me":"")+'"><div class="m'+(me?" me":"")+'">'+esc(m.text)+' <span>'+new Date(m.created_at).toLocaleString("fr",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})+'</span></div></div>'}).join(""):'<p style="color:var(--mu)">Aucun message. Présentez votre club et votre proposition.</p>';
  box.scrollTop=box.scrollHeight;return}
 var c={};S.prives.forEach(function(m){c[other(m)]=m});
 var ids=Object.keys(c).sort(function(a,b){return c[b].id-c[a].id});
 box.innerHTML=ids.length?ids.map(function(id){var m=c[id],p=peerOf(id);return '<button type="button" class="card conv" data-p="'+esc(id)+'"><div class="av">'+avh(p)+'</div><h3>'+esc(p?p.pseudo:"Utilisateur")+'</h3><p>'+(m.from_id===S.user.id?"Vous : ":"")+esc(m.text.slice(0,80))+'</p></button>'}).join(""):'<div class="panel" style="grid-column:1/-1;color:var(--mu)">'+(myClub()?"Aucun message. Dans « Joueurs », invitez ou contactez un joueur qui cherche un club.":"Aucun message pour le moment. Cochez « Je recherche un club » dans votre profil pour être visible des clubs.")+'</div>'}
function invHTML(){var l=pendingInv();return l.length?'<h3 style="margin:18px 0 0">Invitations</h3><div class="grid">'+l.map(function(i){var c=clubById(i.club_id)||{};return '<article class="card"><h3>'+esc(c.nom||"Club")+'</h3><small>'+esc(c.ville||"")+'</small>'+(c.verifie?'<div style="margin-top:8px"><span class="pill">✔ Club vérifié</span></div>':"")+'<p>'+esc(i.message||"")+'</p><div class="row" style="margin-top:12px"><button type="button" class="btn" style="padding:8px 16px" data-ac="'+i.id+'">Accepter</button><button type="button" class="btn g" style="padding:8px 16px" data-rf="'+i.id+'">Refuser</button></div></article>'}).join("")+'</div><h3 style="margin:22px 0 0">Messages</h3>':""}
function inbox(){
 markSeen();nav();
 if(S.peer){var pe=peerOf(S.peer);
  main.innerHTML='<div class="row" style="margin:24px 0 12px"><button class="btn g" id="bk" type="button">← Retour</button><h2 style="margin:0">'+esc(pe?pe.pseudo:"Utilisateur")+'</h2></div><div class="panel chat"><div class="msgs" id="ib" role="log" aria-live="polite"></div><form class="send" id="df"><input id="dt" maxlength="1000" placeholder="Votre message…" aria-label="Message privé" autocomplete="off"><button class="btn" type="submit">Envoyer</button></form></div><p class="note">Conversation privée. Ne partagez ni adresse ni données sensibles ; les mineurs doivent être accompagnés d’un responsable.</p>';
  $("#bk").onclick=function(){S.peer=null;inbox()};
  $("#df").onsubmit=async function(e){e.preventDefault();var t=$("#dt").value.trim();if(!t)return;var b=e.submitter;b.disabled=true;
   var r=await sb.from("prives").insert({to_id:S.peer,text:t.slice(0,1000)});b.disabled=false;
   if(r.error){toast("Message non envoyé : vous ne pouvez pas écrire à ce joueur");return}
   $("#dt").value="";loadPrives()}}
 else main.innerHTML='<h2 style="margin:24px 0 4px">Offres</h2><div id="iv">'+invHTML()+'</div><div class="grid" id="ib"></div>';
 fillInbox()}
function roster(k,own){var l=S.membres.filter(function(x){return x.club_id===k.id});return '<h3 style="margin:22px 0 8px">Joueurs du club ('+l.length+')</h3>'+(l.length?'<div class="grid">'+l.map(function(x){var p=peerOf(x.joueur_id);return '<article class="card"><div class="av">'+avh(p)+'</div><h3>'+esc(p?p.pseudo:"Joueur")+'</h3><small>'+esc(p&&p.poste||"")+'</small>'+(own?'<div style="margin-top:10px"><button type="button" class="btn g" style="padding:6px 14px" data-rm="'+esc(x.joueur_id)+'">Retirer</button></div>':"")+'</article>'}).join("")+'</div>':'<p style="color:var(--mu)">Aucun joueur pour le moment.</p>')}
function sentInv(c){var l=S.invs.filter(function(i){return i.club_id===c.id}),L={en_attente:"En attente",acceptee:"Acceptée",refusee:"Refusée",annulee:"Annulée"};
 return '<h3 style="margin:22px 0 8px">Invitations envoyées</h3>'+(l.length?'<div class="panel">'+l.map(function(i){var p=peerOf(i.joueur_id);return '<div class="row" style="justify-content:space-between;padding:6px 0"><span>'+esc(p?p.pseudo:"Joueur")+' <span class="pill">'+(L[i.statut]||esc(i.statut))+'</span></span>'+(i.statut==="en_attente"?'<button type="button" class="btn g" style="padding:6px 14px" data-cx="'+i.id+'">Annuler</button>':"")+'</div>'}).join("")+'</div>':'<p style="color:var(--mu)">Aucune invitation. Dans « Joueurs », invitez ceux qui cherchent un club.</p>')}
function clubView(){
 var c=myClub(),m=S.membres.filter(function(x){return x.joueur_id===S.user.id})[0],mc=m&&clubById(m.club_id),h='<h2 style="margin:24px 0 12px">Mon club</h2>';
 if(mc&&!c){main.innerHTML=h+'<div class="panel"><b>'+esc(mc.nom)+'</b> <small style="color:var(--mu)">'+esc(mc.ville||"")+'</small><p style="color:var(--mu)">Vous êtes membre de ce club.</p><button type="button" class="btn g" data-lv="1">Quitter le club</button></div>'+roster(mc,false);return}
 main.innerHTML=h+'<form class="panel form" id="cf"><label class="full">Nom du club<input id="cn" required minlength="2" maxlength="60" value="'+esc(c?c.nom:"")+'"></label><label>Ville<input id="cv" maxlength="60" value="'+esc(c?c.ville||"":"")+'"></label><label>Niveau<select id="cl">'+LVL.map(function(x){return '<option'+(c&&c.niveau===x?" selected":"")+'>'+x+'</option>'}).join("")+'</select></label><label class="full">Présentation<textarea id="cd" rows="3" maxlength="240">'+esc(c?c.description||"":"")+'</textarea></label><div class="full row"><button class="btn" type="submit">'+(c?"Enregistrer":"Créer mon club")+'</button>'+(c?'<button type="button" class="btn g" data-dc="'+c.id+'">Supprimer le club</button>':"")+'</div></form>'+
 (c?'<p class="note">'+(c.verifie?"✔ Club vérifié : vous pouvez inviter les joueurs qui cherchent un club.":"Club en attente de validation par l’administrateur : vous pourrez inviter des joueurs dès qu’il sera validé.")+'</p>'+roster(c,true)+sentInv(c):'<p class="note">Créez votre club pour inviter des joueurs. Il doit d’abord être validé par l’administrateur.</p>');
 $("#cf").onsubmit=async function(e){e.preventDefault();var b=e.submitter;b.disabled=true;var d={nom:$("#cn").value.trim().slice(0,60),ville:$("#cv").value.trim().slice(0,60),niveau:$("#cl").value,description:$("#cd").value.trim().slice(0,240)};
  var r=c?await sb.from("clubs").update(d).eq("id",c.id):await sb.from("clubs").insert(d);
  if(r.error){toast("Enregistrement impossible");b.disabled=false;return}
  toast(c?"Club enregistré":"Club créé");S.csig=null;await loadClubs()}}
async function loadClubs(){
 if(!S.user)return;
 var r=await Promise.all([sb.from("clubs").select("*"),sb.from("membres").select("joueur_id,club_id"),sb.from("invitations").select("id,club_id,joueur_id,message,statut,created_at").order("id",{ascending:false}).limit(200)]);
 if(r[0].error||r[1].error||r[2].error||!S.user)return;
 var sig=JSON.stringify([r[0].data,r[1].data,r[2].data]);if(sig===S.csig)return;
 var first=S.csig==null,before=pendingInv().length;S.csig=sig;S.clubs=r[0].data||[];S.membres=r[1].data||[];S.invs=r[2].data||[];
 if(!first&&S.view!=="inbox"&&pendingInv().length>before)toast("Nouvelle invitation de club");
 nav();var ae=document.activeElement,ty=!!ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&main.contains(ae);
 if(ty)return;
 if(S.view==="club")clubView();else if(S.view==="players")players();else if(S.view==="inbox"&&!S.peer){var iv=$("#iv");if(iv)iv.innerHTML=invHTML()}}
main.onclick=async function(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset,r;
 if(d.p){S.peer=d.p;inbox();return}
 if(d.c){S.peer=d.c;setView("inbox",true);return}
 if(d.iv){var c=myClub();b.disabled=true;r=await sb.from("invitations").insert({club_id:c.id,joueur_id:d.iv,message:("Le club "+c.nom+" vous invite à le rejoindre.").slice(0,300)});toast(r.error?"Invitation impossible":"Invitation envoyée");await loadClubs();return}
 if(d.ac||d.rf){var ok=!!d.ac;b.disabled=true;r=await sb.rpc("repondre_invitation",{inv:+(d.ac||d.rf),ok:ok});if(r.error){toast("Action impossible");b.disabled=false;return}toast(ok?"Vous avez rejoint le club":"Invitation refusée");await loadClubs();await loadPlayers();return}
 if(d.cx){r=await sb.from("invitations").delete().eq("id",+d.cx);if(!r.error)await loadClubs();return}
 if(d.rm){if(!confirm("Retirer ce joueur du club ?"))return;r=await sb.from("membres").delete().eq("joueur_id",d.rm);if(r.error)toast("Action impossible");else await loadClubs();return}
 if(d.lv){if(!confirm("Quitter ce club ?"))return;r=await sb.from("membres").delete().eq("joueur_id",S.user.id);if(r.error)toast("Action impossible");else await loadClubs();return}
 if(d.dc){if(!confirm("Supprimer votre club ?"))return;r=await sb.from("clubs").delete().eq("id",+d.dc);if(r.error)toast("Suppression impossible");else await loadClubs()}};
async function loadPrives(){
 if(!S.user)return;
 var r=await sb.from("prives").select("id,from_id,to_id,text,created_at").order("id",{ascending:false}).limit(300);
 if(r.error||!S.user)return;
 var prev=S.pMax,list=(r.data||[]).reverse(),mx=list.length?list[list.length-1].id:0;
 if(prev===mx&&list.length===S.prives.length)return;
 S.prives=list;S.pMax=mx;
 if(prev!=null&&S.view!=="inbox"&&!document.hidden&&list.some(function(m){return m.id>prev&&m.to_id===S.user.id}))toast("Nouveau message de recrutement");
 if(S.view==="inbox")markSeen();
 nav();fillInbox()}

async function loadPlayers(){var r=await sb.from("profiles").select("*");S.players=r.data||[];if(S.view==="players"||S.view==="home")draw()}
async function loadMsgs(){var r=await sb.from("messages").select("id,user_id,text,created_at,profiles!messages_user_id_fkey(pseudo)").order("id",{ascending:false}).limit(100);if(r.error){toast("Chargement des messages impossible : "+r.error.message);return}S.msgs=(r.data||[]).reverse();S.maxId=S.msgs.length?S.msgs[S.msgs.length-1].id:0;S.boot=true;drawMsgs();loadReacts()}
async function pollNew(){
 if(!S.user||!S.boot||S.busy)return;S.busy=true;
 try{var r=await sb.from("messages").select("id,user_id,text,created_at,profiles!messages_user_id_fkey(pseudo)").gt("id",S.maxId).order("id",{ascending:true}).limit(50);
  if(r.error||!r.data||!r.data.length)return;
  r.data.forEach(function(m){S.msgs.push(m);S.maxId=Math.max(S.maxId,m.id);if(m.user_id!==S.user.id)notify(m)});
  if(S.msgs.length>200)S.msgs=S.msgs.slice(-200);
  drawMsgs();loadReacts()}
 finally{S.busy=false}}
function subscribe(){
 sb.removeAllChannels();
 S.ch=sb.channel("live").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},pollNew).on("postgres_changes",{event:"*",schema:"public",table:"message_reactions"},loadReacts).on("postgres_changes",{event:"INSERT",schema:"public",table:"prives"},loadPrives).on("postgres_changes",{event:"*",schema:"public",table:"clubs"},loadClubs).on("postgres_changes",{event:"*",schema:"public",table:"membres"},loadClubs).on("postgres_changes",{event:"*",schema:"public",table:"invitations"},loadClubs).on("postgres_changes",{event:"*",schema:"public",table:"profiles"},loadPlayers).subscribe()
}
async function onUser(u){
 S.user=u;
 if(u){await loadClubs();await loadPlayers();await loadMsgs();await loadPrives();subscribe();
  if(!S.poll){S.poll=setInterval(function(){pollNew();loadPrives();S.t=(S.t||0)+1;if(S.t%3===0)loadClubs();if(S.user&&S.view==="chat"&&!document.hidden)loadReacts()},5000);
   document.addEventListener("visibilitychange",function(){if(S.user&&!document.hidden){if(S.view==="chat"){S.unread=0;nav()}pollNew();loadPrives();loadClubs();loadPlayers()}})}
  if(S.view==="auth")S.view=mine()?"players":"me"}
 else{sb.removeAllChannels();S.players=[];S.msgs=[];S.reacts={};S.prives=[];S.pMax=null;S.peer=null;S.clubs=[];S.membres=[];S.invs=[];S.csig=null;S.unread=0;S.maxId=0;S.boot=false;S.view="home"}
 draw()
}
draw();
if(configured){
 sb.auth.onAuthStateChange(function(_e,s){var u=s?s.user:null;
  if((u&&S.user&&u.id===S.user.id)||(!u&&!S.user&&S.ready)){S.user=u;return}
  S.ready=true;setTimeout(function(){onUser(u)},0)});
}
})();
</script>
</body>
