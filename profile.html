<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon profil — Basket Connect</title>
<meta name="theme-color" content="#15171c">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="logo" href="index.html" style="text-decoration:none">Basket<b>Connect</b></a>
  <nav><a class="btn" href="index.html" style="display:inline-flex;align-items:center;text-decoration:none">Retour aux joueurs</a></nav>
</header>
<main>
  <section>
    <h2>Mon profil</h2>
    <p id="gate" class="msg">Chargement…</p>
    <form id="pf" class="hidden">
      <p class="meta" id="role-info"></p>
      <label>Nom public<input id="p-name" maxlength="40" required></label>
      <label>Date de naissance<input id="p-birth" type="date"></label>
      <label>Téléphone (privé, jamais affiché)<input id="p-phone" type="tel" autocomplete="tel"></label>
      <label>Ville<input id="p-city" maxlength="60"></label>
      <div class="filters">
        <label>Poste<select id="p-pos"><option value="">—</option><option>Meneur</option><option>Arrière</option><option>Ailier</option><option>Ailier fort</option><option>Pivot</option></select></label>
        <label>Niveau<select id="p-level"><option value="">—</option><option>Débutant</option><option>Amateur</option><option>Confirmé</option><option>Professionnel</option></select></label>
        <label>Taille (cm)<input id="p-height" type="number" min="120" max="250"></label>
      </div>
      <label>Présentation (1000 caractères max)<input id="p-bio" maxlength="1000"></label>
      <label>Lien vidéo (YouTube ou Vimeo)<input id="p-video" type="url" placeholder="https://www.youtube.com/…"></label>
      <label class="row"><input id="p-looking" type="checkbox" style="width:auto;min-height:0"> Je cherche un club</label>
      <label class="row"><input id="p-public" type="checkbox" style="width:auto;min-height:0"> Afficher mon profil dans l’annuaire public</label>
      <p id="minor-note" class="msg hidden">Tu as moins de 18 ans : ton profil ne sera visible qu’après validation du consentement parental par l’administration.</p>
      <p id="p-msg" class="msg" role="alert"></p>
      <button class="btn primary" type="submit">Enregistrer</button>
    </form>
    <div id="verify" class="hidden" style="margin-top:28px">
      <h2>Vérification</h2>
      <p class="meta">Les comptes club et recruteur sont activés après vérification manuelle par l’administration.</p>
      <form id="vf"><label>Informations utiles (nom du club, licence, fonction)<input id="v-note" maxlength="500" required></label>
        <p id="v-msg" class="msg" role="alert"></p><button class="btn" type="submit">Envoyer ma demande</button></form>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="profile.js"></script>
</body>
</html>
